<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>STRANR.NET</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#040404;--bg2:#080808;--bg3:#0d0d0d;
  --border:#181818;--border2:#222;
  --g1:#00ff41;--g2:#00cc33;--g3:#008f23;--g4:#004d13;--g5:#002a0a;
  --glow:rgba(0,255,65,.1);--glow2:rgba(0,255,65,.22);
  --red:#ff2b2b;--amber:#ffa500;--white:#e8ffe9;
  --text:#a8ffb2;--text2:#3d7a45;--text3:#1e3d22;
}
html,body{height:100%;width:100%;background:var(--bg);color:var(--g1);font-family:'Share Tech Mono',monospace;overflow:hidden;cursor:default;}
#mx{position:fixed;inset:0;opacity:.06;pointer-events:none;z-index:0;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.13) 3px,rgba(0,0,0,.13) 4px);pointer-events:none;z-index:9999;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:9998;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .35s ease;}
.screen.active{opacity:1;pointer-events:all;}

/* BOOT */
#scBoot{align-items:flex-start;justify-content:flex-start;padding:36px 44px;}
#bootLog{font-size:13px;line-height:2;max-width:700px;}
#bootLog .bl{display:block;opacity:0;animation:show 0s .01s forwards;}
@keyframes show{to{opacity:1}}
#bCur{display:inline-block;width:9px;height:14px;background:var(--g1);vertical-align:middle;margin-left:3px;animation:cb .55s infinite;}
@keyframes cb{0%,49%{opacity:1}50%,100%{opacity:0}}

/* MENU */
#scMenu{gap:0;}
.m-logo{font-family:'VT323',monospace;font-size:104px;line-height:1;letter-spacing:10px;color:var(--g1);text-shadow:0 0 18px var(--g1),0 0 50px var(--g4);animation:flk 9s infinite;}
@keyframes flk{0%,92%,100%{opacity:1}93%{opacity:.7}94%{opacity:1}95%{opacity:.4}96%{opacity:1}}
.m-sub{font-size:11px;color:var(--text2);letter-spacing:5px;text-transform:uppercase;text-align:center;margin-top:5px;margin-bottom:34px;}
.m-box{border:1px solid var(--border2);background:rgba(0,255,65,.02);padding:30px 38px;width:400px;position:relative;}
.m-box::before{content:'';position:absolute;top:-1px;left:18px;right:18px;height:1px;background:var(--g1);box-shadow:0 0 8px var(--g1),0 0 20px var(--g3);}
.m-lbl{display:block;font-size:10px;color:var(--text2);letter-spacing:3px;text-transform:uppercase;margin-bottom:7px;}
.m-sec{margin-bottom:20px;}
.m-inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--g1);font-family:'Share Tech Mono',monospace;font-size:15px;padding:8px 0;outline:none;caret-color:var(--g1);letter-spacing:1.5px;transition:border-color .2s;}
.m-inp:focus{border-bottom-color:var(--g2);box-shadow:0 1px 0 var(--glow2);}
.m-inp::placeholder{color:var(--text3);}
.m-inp.err{border-bottom-color:var(--red);color:var(--red);}
.m-div{height:1px;background:var(--border);margin:22px 0;}
.go-btn{width:100%;background:transparent;border:1px solid var(--g1);color:var(--g1);font-family:'VT323',monospace;font-size:28px;letter-spacing:6px;padding:13px;cursor:pointer;text-transform:uppercase;transition:all .2s;text-shadow:0 0 10px var(--g1);box-shadow:0 0 12px var(--g5),inset 0 0 12px rgba(0,255,65,.02);position:relative;overflow:hidden;}
.go-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,65,.07),transparent);transition:left .4s;}
.go-btn:hover::after{left:100%;}
.go-btn:hover{background:rgba(0,255,65,.04);box-shadow:0 0 24px var(--g4),inset 0 0 16px rgba(0,255,65,.04);}
.go-btn:active{transform:scale(.98);}
.m-foot{text-align:center;margin-top:14px;font-size:10px;color:var(--text3);letter-spacing:.8px;line-height:2;}
.m-online{font-size:11px;color:var(--g3);letter-spacing:2px;margin-bottom:20px;text-align:center;}
.m-online b{color:var(--g1);}

/* CHAT */
#scChat{flex-direction:column;align-items:stretch;justify-content:stretch;padding:0;max-width:880px;margin:0 auto;width:100%;}
.c-hdr{display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:rgba(0,255,65,.015);flex-shrink:0;gap:14px;}
.c-logo{font-family:'VT323',monospace;font-size:28px;color:var(--g1);letter-spacing:3px;text-shadow:0 0 10px var(--g1);}
.c-sep{color:var(--text3);}
.c-user{font-size:12px;color:var(--text2);letter-spacing:1px;}
.c-user b{color:var(--g1);font-weight:normal;}
.sp{flex:1;}
.c-status{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s,box-shadow .3s;flex-shrink:0;}
.cdot.on{background:var(--g1);box-shadow:0 0 8px var(--g1);}
.cdot.seek{background:var(--amber);animation:blk .6s infinite alternate;}
.cdot.off{background:var(--red);}
@keyframes blk{from{opacity:.2}to{opacity:1}}
.c-online-hdr{font-size:10px;color:var(--text3);letter-spacing:1px;}
.c-online-hdr b{color:var(--g2);}
.hdr-btn{background:none;border:1px solid var(--border2);color:var(--text3);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:5px 10px;cursor:pointer;transition:all .15s;}
.hdr-btn:hover{color:var(--g1);border-color:var(--g3);}

.msgs{flex:1;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;min-height:0;}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border2);}

.msg{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.75;animation:mi .12s ease;}
@keyframes mi{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
.mw{font-size:11px;letter-spacing:1px;min-width:82px;text-align:right;flex-shrink:0;}
.msp{color:var(--text3);}
.mb{flex:1;word-break:break-word;}
.msg.sys .mw{color:var(--text3);}.msg.sys .mb{color:var(--text3);font-style:italic;}
.msg.str .mw{color:var(--red);}.msg.str .mb{color:var(--white);}
.msg.you .mw{color:var(--g1);}.msg.you .mb{color:#fff;}
.msg.warn .mw,.msg.warn .mb{color:var(--amber);font-style:italic;}

.typ-row{display:flex;align-items:center;gap:10px;padding:4px 24px;font-size:11px;color:var(--red);letter-spacing:1px;min-height:22px;opacity:0;transition:opacity .2s;flex-shrink:0;}
.typ-row.show{opacity:1;}
.tdots{display:flex;gap:3px;align-items:center;}
.tdots span{width:4px;height:4px;border-radius:50%;background:var(--red);animation:td 1.1s infinite ease-in-out;}
.tdots span:nth-child(2){animation-delay:.18s;}.tdots span:nth-child(3){animation-delay:.36s;}
@keyframes td{0%,80%,100%{transform:scale(.5);opacity:.2}40%{transform:scale(1);opacity:1}}

.c-btm{border-top:1px solid var(--border);background:rgba(0,255,65,.01);flex-shrink:0;}
.inp-row{display:flex;align-items:center;border-bottom:1px solid var(--border);}
.inp-prm{padding:0 14px;font-size:15px;color:var(--g1);flex-shrink:0;text-shadow:0 0 8px var(--g1);}
.c-inp{flex:1;background:transparent;border:none;color:#fff;font-family:'Share Tech Mono',monospace;font-size:14px;padding:13px 0;outline:none;caret-color:var(--g1);letter-spacing:.5px;}
.c-inp::placeholder{color:var(--text3);}.c-inp:disabled{opacity:.15;cursor:not-allowed;}
.c-chr{font-size:10px;color:var(--text3);padding:0 10px;flex-shrink:0;}
.c-chr.warn{color:var(--amber);}
.s-btn{background:transparent;border-left:1px solid var(--border);color:var(--g1);font-family:'VT323',monospace;font-size:22px;letter-spacing:3px;padding:13px 18px;cursor:pointer;transition:all .15s;text-shadow:0 0 8px var(--g1);}
.s-btn:hover:not(:disabled){background:var(--glow);}.s-btn:active:not(:disabled){transform:scale(.97);}.s-btn:disabled{opacity:.12;cursor:not-allowed;}
.act-row{display:flex;align-items:center;padding:9px 16px;gap:8px;}
.a-btn{background:none;border:1px solid var(--border2);color:var(--text3);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:all .15s;}
.a-btn:hover:not(:disabled){border-color:var(--g3);color:var(--g2);}.a-btn.kill:hover:not(:disabled){border-color:var(--red);color:var(--red);}.a-btn:disabled{opacity:.18;cursor:not-allowed;}
.a-tip{font-size:10px;color:var(--text3);letter-spacing:.5px;margin-left:auto;}
</style>
</head>
<body>
<canvas id="mx"></canvas>

<!-- BOOT -->
<div class="screen active" id="scBoot">
  <div id="bootLog"></div>
</div>

<!-- MENU -->
<div class="screen" id="scMenu">
  <div class="m-logo">STRANR</div>
  <div class="m-sub">anonymous · untraceable · real</div>
  <div class="m-online">// <b id="menuOnline">–</b> nodes online</div>
  <div class="m-box">
    <div class="m-sec">
      <span class="m-lbl">// choose a handle</span>
      <input class="m-inp" id="uInp" type="text" placeholder="ghost_0x00" maxlength="18" autocomplete="off" spellcheck="false"/>
    </div>
    <div class="m-div"></div>
    <button class="go-btn" id="goBtn">[ CONNECT ]</button>
  </div>
  <div class="m-foot">
    <div>no logs &nbsp;·&nbsp; no accounts &nbsp;·&nbsp; no identity</div>
    <div style="color:var(--g4)">you are completely anonymous</div>
  </div>
</div>

<!-- CHAT -->
<div class="screen" id="scChat">
  <div class="c-hdr">
    <div class="c-logo">STRANR</div>
    <div class="c-sep">//</div>
    <div class="c-user">as <b id="dispUser">ghost</b></div>
    <div class="sp"></div>
    <div class="c-online-hdr">// <b id="hdrOnline">–</b> online</div>
    <div class="c-status"><div class="cdot" id="cdot"></div><span id="cstat">idle</span></div>
    <button class="hdr-btn" id="exitBtn">[ exit ]</button>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="typ-row" id="typRow">
    <div class="tdots"><span></span><span></span><span></span></div>
    <span>stranger is typing...</span>
  </div>

  <div class="c-btm">
    <div class="inp-row">
      <span class="inp-prm">&gt;&gt;</span>
      <input class="c-inp" id="cInp" type="text" placeholder="transmit message..." maxlength="300" disabled autocomplete="off" spellcheck="false"/>
      <span class="c-chr" id="cChr"></span>
      <button class="s-btn" id="sBtn" disabled>SEND</button>
    </div>
    <div class="act-row">
      <button class="a-btn" id="newBtn">[ new_stranger ]</button>
      <button class="a-btn kill" id="killBtn" disabled>[ kill_feed ]</button>
      <span class="a-tip" id="aTip">press enter to transmit</span>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
/* ─── MATRIX ─── */
(()=>{
  const c=document.getElementById('mx'),x=c.getContext('2d');
  const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF|\\/#@$%&*!?'.split('');
  let cols,drops;
  function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/15);drops=Array(cols).fill(1);}
  function draw(){
    x.fillStyle='rgba(0,0,0,0.055)';x.fillRect(0,0,c.width,c.height);
    x.font='13px Share Tech Mono,monospace';
    for(let i=0;i<drops.length;i++){
      const ch=chars[Math.floor(Math.random()*chars.length)];
      x.fillStyle=Math.random()>.93?'#b0ffb8':'#00ff41';
      x.fillText(ch,i*15,drops[i]*15);
      if(drops[i]*15>c.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  }
  resize();window.addEventListener('resize',resize);setInterval(draw,50);
})();

/* ─── BOOT ─── */
const bootLines=[
  {d:0,   col:'#1e3d22', t:'STRANR.NET  v4.0.1  —  SECURE TERMINAL'},
  {d:70,  col:'#1e3d22', t:'Anonymous Collective  /  All Rights Reserved'},
  {d:120, col:null,      t:''},
  {d:200, col:'#00cc33', t:'[  OK  ]  Initializing onion routing layer...'},
  {d:370, col:'#00cc33', t:'[  OK  ]  Stripping IP metadata from headers...'},
  {d:530, col:'#00cc33', t:'[  OK  ]  Loading ephemeral session module...'},
  {d:690, col:'#ffa500', t:'[  !!  ]  Identity obfuscation active'},
  {d:840, col:'#00cc33', t:'[  OK  ]  Connecting to stranger pool...'},
  {d:1000,col:'#ffa500', t:'[  !!  ]  All sessions unlogged and anonymous'},
  {d:1140,col:null,      t:''},
  {d:1240,col:'#00ff41', t:'System ready. Awaiting authentication...'},
];
const log=document.getElementById('bootLog');
function runBoot(){
  bootLines.forEach((l,i)=>{
    setTimeout(()=>{
      const s=document.createElement('span');s.className='bl';
      s.style.color=l.col||'transparent';
      s.textContent=l.t||'\u00a0';
      log.appendChild(s);
      if(i===bootLines.length-1){
        const cur=document.createElement('span');cur.id='bCur';log.appendChild(cur);
        setTimeout(()=>show('scMenu'),800);
      }
    },l.d);
  });
}

/* ─── SCREENS ─── */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ─── SOCKET ─── */
const socket = io();
let USERNAME = '';
let connected = false;
let typingTimer = null;
let isTyping = false;

socket.on('online_count', n => {
  document.getElementById('menuOnline').textContent = n;
  document.getElementById('hdrOnline').textContent = n;
});

socket.on('status', ({ state, msg }) => {
  if (state === 'waiting') {
    setStatus('seek', 'searching...');
    addMsg('sys', '//', msg);
    aTip.textContent = 'waiting for a stranger...';
    sBtn.disabled = true;
    cInp.disabled = true;
    killBtn.disabled = true;
  }
});

socket.on('matched', () => {
  connected = true;
  setStatus('on', 'connected');
  addMsg('sys', '//', 'encrypted channel open. stranger connected.');
  sBtn.disabled = false;
  cInp.disabled = false;
  killBtn.disabled = false;
  cInp.focus();
  aTip.textContent = 'enter to transmit  ·  new_stranger to skip';
});

socket.on('message', ({ text }) => {
  showTyping(false);
  addMsg('str', 'stranger', text);
});

socket.on('typing', () => {
  showTyping(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => showTyping(false), 2000);
});

socket.on('partner_left', ({ msg }) => {
  connected = false;
  showTyping(false);
  setStatus('off', 'disconnected');
  addMsg('warn', '//', msg);
  sBtn.disabled = true;
  cInp.disabled = true;
  killBtn.disabled = true;
  aTip.textContent = 'stranger left  ·  new_stranger to find another';
});

socket.on('connect_error', () => {
  setStatus('off', 'error');
  addMsg('warn', '//', 'connection to server lost. refresh to reconnect.');
});

/* ─── MENU ─── */
const uInp = document.getElementById('uInp');
const goBtn = document.getElementById('goBtn');

goBtn.onclick = () => {
  const u = uInp.value.trim();
  uInp.classList.remove('err');
  if (!u) { uInp.classList.add('err'); uInp.placeholder = 'required'; return; }
  USERNAME = u;
  document.getElementById('dispUser').textContent = u;
  show('scChat');
  socket.emit('join', { username: u });
};
uInp.onkeydown = e => { if (e.key === 'Enter') goBtn.click(); };
uInp.oninput = () => uInp.classList.remove('err');

document.getElementById('exitBtn').onclick = () => {
  killConnection();
  show('scMenu');
};

/* ─── CHAT ─── */
const msgsEl = document.getElementById('msgs');
const cInp = document.getElementById('cInp');
const sBtn = document.getElementById('sBtn');
const newBtn = document.getElementById('newBtn');
const killBtn = document.getElementById('killBtn');
const typRow = document.getElementById('typRow');
const cdot = document.getElementById('cdot');
const cstat = document.getElementById('cstat');
const cChr = document.getElementById('cChr');
const aTip = document.getElementById('aTip');

function setStatus(mode, text) { cdot.className = 'cdot ' + mode; cstat.textContent = text; }
function showTyping(show) { typRow.classList.toggle('show', show); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addMsg(type, who, body) {
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  d.innerHTML = `<span class="mw">${who}</span><span class="msp"> : </span><span class="mb">${esc(body)}</span>`;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function sendMsg() {
  const t = cInp.value.trim();
  if (!t || !connected) return;
  cInp.value = ''; cChr.textContent = '';
  addMsg('you', USERNAME, t);
  socket.emit('message', { text: t });
  socket.emit('stop_typing');
  isTyping = false;
}

function killConnection() {
  if (connected || true) {
    socket.emit('skip');
    connected = false;
    showTyping(false);
    setStatus('off', 'disconnected');
    if (msgsEl.children.length) addMsg('sys', '//', 'connection terminated.');
    sBtn.disabled = true;
    cInp.disabled = true;
    killBtn.disabled = true;
    aTip.textContent = 'disconnected  ·  new_stranger to reconnect';
  }
}

sBtn.onclick = sendMsg;
cInp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
cInp.oninput = () => {
  const l = cInp.value.length;
  cChr.textContent = l > 250 ? String(300 - l) : '';
  cChr.className = 'c-chr' + (l > 270 ? ' warn' : '');
  if (connected && l > 0 && !isTyping) {
    isTyping = true;
    socket.emit('typing');
  }
  if (l === 0) isTyping = false;
};

newBtn.onclick = () => {
  msgsEl.innerHTML = '';
  connected = false;
  showTyping(false);
  sBtn.disabled = true;
  cInp.disabled = true;
  killBtn.disabled = true;
  socket.emit('skip');
  socket.emit('join', { username: USERNAME });
};

runBoot();
</script>
</body>
</html>
